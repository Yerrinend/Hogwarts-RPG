name: RPG save integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current save and publication files
        run: python scripts/rpg_sync.py validate
      - name: Test safe sync in isolated local Git repositories
        run: python scripts/test_sync.py
      - name: Validate turn against current main
        if: github.event_name == 'pull_request'
        run: python scripts/rpg_sync.py validate --base origin/main
